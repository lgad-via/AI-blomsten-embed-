<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-blomsten – Plakat</title><style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#172d3c;font:16px Arial,sans-serif}main{max-width:1000px;margin:auto;padding:16px}h1{font-size:1.6rem;margin:0 0 18px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0}label{font-weight:600}select{padding:10px 12px;background:#fff;color:#152a39;border:1px solid #6d8291;border-radius:6px;font:inherit;max-width:100%}option{background:#fff;color:#152a39}button,.action-link{display:inline-block;background:#176a9a;color:white;border:0;border-radius:7px;padding:11px 16px;font:600 15px Arial,sans-serif;text-decoration:none;cursor:pointer}button:hover,.action-link:hover{background:#115277}.poster-image{display:block;max-width:750px;width:100%;height:auto;margin:22px auto}p{line-height:1.5}[data-embed-theme=dark] body{color:#f0f3f6}[data-embed-theme=dark] select,[data-embed-theme=dark] option{background:#1e2e3b;color:#fff;border-color:#9fb2c1}@media(max-width:550px){main{padding:10px}.controls{align-items:stretch;flex-direction:column}.controls>*{width:100%}}
</style></head><body><main><h1 data-da="Plakat" data-en="Poster">Plakat</h1><div class="controls"><label for="poster-version" data-da="Vælg plakat" data-en="Choose poster">Vælg plakat</label><select id="poster-version"><option value="plakat.png" data-da="Plakat MED eksempler" data-en="Poster WITH examples">Plakat MED eksempler</option><option value="AI-blomsten-plakat-uden-eksempler.png" data-da="Plakat UDEN eksempler" data-en="Poster WITHOUT examples">Plakat UDEN eksempler</option></select></div><div class="controls"><a class="action-link" id="poster-selected-download" href="plakat.png" download="AI-blomsten-plakat.png" data-da="Download plakaten" data-en="Download poster">Download plakaten</a><button type="button" id="poster-selected-print" data-print-poster="plakat.png" data-da="Udskriv plakaten" data-en="Print poster">Udskriv plakaten</button></div><h2 data-da="Din egen plakat" data-en="Create your own poster">Din egen plakat</h2><p data-da="Skriv dine egne tekster i taleboblerne. I editoren kan du downloade og udskrive din plakat." data-en="Write your own text in the speech bubbles. Download or print your poster in the editor.">Skriv dine egne tekster i taleboblerne. I editoren kan du downloade og udskrive din plakat.</p><a class="action-link" id="poster-editor-link" href="plakat-editor.html" data-da="Lav din egen plakat" data-en="Create your own poster">Lav din egen plakat</a><p role="status" aria-live="polite" id="poster-print-status"></p><img class="poster-image" src="plakat.png" alt="AI-blomsten plakat"></main><script src="plakat-print.js"></script><script>
const sel=document.getElementById('poster-version');sel.addEventListener('change',()=>{const v=sel.value;const a=document.getElementById('poster-selected-download');a.href=v;a.download=v;document.getElementById('poster-selected-print').dataset.printPoster=v;document.querySelector('.poster-image').src=v;});
const lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'da';document.querySelectorAll('[data-da]').forEach(x=>x.textContent=x.dataset[lang]);document.getElementById('poster-editor-link').href='plakat-editor.html'+location.search;
</script><script src="embed-bridge.js"></script></body></html>
